name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/**'
      - 'integration_test/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.*'
      - '.github/workflows/android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool integration_test
      - run: flutter analyze lib
      - run: flutter test

      - name: Build release APKs (one per CPU type)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          fi
          flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: intellego-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
