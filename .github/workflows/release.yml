name: Release

# Publishes the Android APKs as a GitHub release when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# "Run workflow" builds the same APKs without publishing, as a dry run.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool integration_test
      - run: flutter analyze lib
      - run: flutter test

      - name: Build release APKs (one per CPU type)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "The signing key is missing: a release must be signed with it" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          # The build number grows with every commit, so each build installs
          # over the previous one.
          flutter build apk --release --split-per-abi \
            --build-number="$(git rev-list --count HEAD)"

      - name: Name the files
        run: |
          version="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = tag ] || version="test-$(git rev-parse --short HEAD)"
          mkdir dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" \
               "dist/Intellego-$version-$abi.apk"
          done
          ls -l dist

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          **Android:** download `Intellego-…-arm64-v8a.apk` (nearly every phone
          made since 2017) and open it. If Android asks, allow installing apps
          from this source. Newer versions install over older ones and keep
          your books.

          Phones from before about 2017 need the `armeabi-v7a` file; the
          `x86_64` file is for emulators and Chromebooks.

          ---
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --title "Intellego ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --generate-notes

      - name: Keep the files of a dry run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: dist/*.apk
          if-no-files-found: error
